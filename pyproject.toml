[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttl-watch"
version = "1.0.0"
description = "Multi-signal DNS anomaly detector for TTL manipulation, DGA, fast-flux, and DNS tunneling"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["security", "dns", "threat-hunting", "dga", "fast-flux", "dns-tunneling", "zeek", "blue-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rich = ["rich>=13.0.0"]
toml = ["tomli>=2.0.0; python_version < '3.11'"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "rich>=13.0.0",
]
all = [
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
ttl-watch = "ttl_watch.cli:main"

[project.urls]
Homepage = "https://github.com/0xPersist/ttl-watch"
Repository = "https://github.com/0xPersist/ttl-watch"
Issues = "https://github.com/0xPersist/ttl-watch/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ttl_watch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
